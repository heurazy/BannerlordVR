# Prototype du fork heurazy/BannerlordVR. Ajouter ces lignes au fichier existant :
# Documents/Mount and Blade II Bannerlord/Configs/BannerlordVR.cfg
# Les modifications de ce fichier d'exemple seules n'activent pas le mod.
# Redemarrer le jeu apres modification.
motion_hands = 1
enemy_physics = 1
enemy_physics_max_agents = 6
enemy_physics_radius = 4
enemy_physics_scan_budget = 128
enemy_physics_budget_ms = 1.5
enemy_physics_grab_spring = 180
enemy_physics_grab_damping = 22
enemy_physics_max_force = 350
enemy_physics_break_distance = 0.65

# Les degats d'armes sont un second essai volontaire : approximation par segments,
# armure et garde conservatrice ; pas encore de collision exacte des lames/boucliers.
enemy_physics_weapon_damage = 0

# Coupe longitudinale au cou : epee/dague, tete tenue par l'autre main,
# gachette pressee et au moins 12 cm de geste continu. Tests mathematiques seulement.
# Necessite aussi enemy_physics_weapon_damage=1. Pas encore de saignement differe.
enemy_physics_neck_cut = 0

# Troisieme essai : ragdoll natif des vivants pendant saisie/penetration.
# Termine la simulation puis attend sa desactivation avant de rendre l'IA.
# Probe isole en jeu reussi : activation puis desactivation, sante conservee.
# Efforts/saisies VR et relevement naturel NON valides.
enemy_physics_living_ragdoll = 0
